[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evilrepair-repairplan"
version = "0.1.0"
description = "按影响范围、修复难度与依赖关系排优先级，标出必须先修的前置项"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "evilrepair" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://evilrepair.github.io"
Repository = "https://github.com/evilrepair/repairplan"
Issues = "https://github.com/evilrepair/repairplan/issues"

[project.scripts]
repairplan = "repairplan:main"

[tool.setuptools]
py-modules = ["repairplan"]
